name: panaprisin-prod-test

services:
  frontend:
    image: web-panaprisin-frontend:prod-test
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - app-network

  backend:
    image: web-panaprisin-backend:prod-test
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ./deploy/local/backend.env
    volumes:
      - product_images:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"
    networks:
      - app-network

  init-public:
    image: web-panaprisin-backend:prod-test
    platform: linux/amd64
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        echo "Initializing Laravel public assets..."
        mkdir -p /shared-public
        cp -a /var/www/html/public/. /shared-public/
        test -f /shared-public/index.php
        echo "Laravel public assets initialized."
    volumes:
      - public_assets:/shared-public
    restart: "no"

  webserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8180:80"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro
      - product_images:/var/www/html/storage/app/public:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      init-public:
        condition: service_completed_successfully
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: panaprisin_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dev_user -d panaprisin_db
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  
  queue:
    image: web-panaprisin-backend:prod-test
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ./deploy/local/backend.env
    command:
      - php
      - artisan
      - queue:work
      - database
      - --sleep=3
      - --tries=3
      - --timeout=60
      - --memory=128
      - --no-interaction
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - product_images:/var/www/html/storage/app/public
    networks:
      - app-network
    stop_grace_period: 90s


networks:
  app-network:
    driver: bridge

volumes:
  prod_pgdata:
  product_images:
  public_assets: